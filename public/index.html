<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Service</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      background: #f8f9ff;
      position: relative;
    }

    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f1ff;
      transform: translateY(-2px);
    }

    .upload-area.dragover {
      border-color: #764ba2;
      background: #e8e9ff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
      color: #667eea;
    }

    .upload-text {
      color: #333;
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .upload-hint {
      color: #999;
      font-size: 13px;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      margin-top: 20px;
      padding: 15px;
      background: #f0f1ff;
      border-radius: 10px;
      display: none;
    }

    .file-info.show {
      display: block;
    }

    .file-name {
      color: #333;
      font-weight: 500;
      margin-bottom: 5px;
      word-break: break-all;
    }

    .file-size {
      color: #666;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .btn-upload {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: none;
    }

    .btn-upload.show {
      display: block;
    }

    .btn-upload:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-upload:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .download-link {
      display: inline-block;
      margin-top: 10px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }

    .download-link:hover {
      text-decoration: underline;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 File Upload Service</h1>
    <p class="subtitle">Upload any file type, up to 50MB</p>
    
    <form id="uploadForm">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">☁️</div>
        <div class="upload-text">Click to browse or drag and drop</div>
        <div class="upload-hint">Any file type supported</div>
        <input type="file" id="fileInput" name="file" />
      </div>

      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>

      <button type="submit" class="btn btn-upload" id="uploadBtn">
        Upload File
      </button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const uploadForm = document.getElementById('uploadForm');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        updateFileInfo();
      }
    });

    fileInput.addEventListener('change', updateFileInfo);

    function updateFileInfo() {
      const file = fileInput.files[0];
      if (file) {
        fileName.textContent = `📄 ${file.name}`;
        fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
        fileInfo.classList.add('show');
        uploadBtn.classList.add('show');
        status.classList.remove('show');
      }
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) {
        showStatus('Please select a file first.', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      uploadBtn.disabled = true;
      showStatus('<span class="spinner"></span>Uploading...', 'loading');

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          showStatus(
            `✅ ${result.message}<br><a href="${result.url}" class="download-link" target="_blank">Download: ${result.fileName}</a>`,
            'success'
          );
          fileInput.value = '';
          fileInfo.classList.remove('show');
          uploadBtn.classList.remove('show');
        } else {
          showStatus(`❌ ${result.error || 'Upload failed'}`, 'error');
        }
      } catch (error) {
        showStatus(`❌ Upload failed: ${error.message}`, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    function showStatus(message, type) {
      status.innerHTML = message;
      status.className = 'status show ' + type;
    }
  </script>
</body>
</html>
